{% extends 'base.html' %}

{% block conteudo %}
<div>
    {{ flash() }}
</div>

<form action="{% if company() %}{{url('company/'~company().id)}}{% else %}{{url('company')}}{% endif %}"
    method="post" enctype="multipart/form-data">

    {% if company().id %}
    <input type="hidden" name="_method" value="put">
    {% endif %}

    <!-- Seção de Logo e Redes Sociais -->
    <div class="row">
        <!-- Logo -->
        <div class="col-md-6 mb-3">
            <div class="mt-2">
                <img src="{{url('templates/assets/img/logos/'~company().logo)}}" id="logo-preview"
                    class="img-thumbnail {% if company().logo == null %}d-none{% endif %}" style="max-height: 150px;">
            </div>
            {% if company().logo %}
            <div class="text-start mt-2">
                <a href="{{ url('company/logo')}}" class="btn btn-outline-danger btn-sm">Remover
                    Logo</a>
            </div>
            {% endif %}
        </div>
    </div>

    <!-- Dados Básicos -->
    <div class="row">
        <div class="col-md-1">
            <label class="form-label">Logo</label>
            <!-- Ícone que aciona o input -->
            <label for="logo" class="btn btn-dark d-inline-flex align-items-center">
                <i class="bi bi-cloud-upload-fill me-1"></i> Upload
            </label>
            <!-- Input escondido -->
            <input name="logo" type="file" class="d-none" id="logo" accept="image/*">
        </div>
        <div class="col-md-4 mb-3">
            <label for="nome" class="form-label">Nome da Empresa *</label>
            <input name="nome" type="text" class="form-control" id="nome" value="{{company().nome}}" required>
            <div class="form-text text-danger">*Obrigatório.</div>
        </div>
        <div class="col-md-3 mb-3">
            <label for="email" class="form-label">Email</label>
            <input name="email" type="email" class="form-control" id="email" value="{{company().email}}">
        </div>
        <div class="col-md-2 mb-3">
            <label for="telefone" class="form-label">Telefone</label>
            <input name="telefone" type="tel" class="form-control" id="telefone" value="{{company().telefone}}">
        </div>
        <div class="col-md-2 mb-3">
            <label for="celular" class="form-label">Celular</label>
            <input name="celular" type="tel" class="form-control" id="celular" value="{{company().celular}}">
        </div>
    </div>

    <!-- Endereço -->
    <h5 class="mt-4 mb-3">Endereço</h5>
    <hr>
    <div class="row">
        <div class="col-md-1 mb-3">
            <label for="rua" class="form-label">CEP</label>
            <input name="cep" type="text" class="form-control" id="cep" value="{{company().cep}}">
        </div>
        <div class="col-md-4 mb-3">
            <label for="rua" class="form-label">Rua</label>
            <input name="rua" type="text" class="form-control" id="rua" value="{{company().rua}}">
        </div>
        <div class="col-md-1 mb-3">
            <label for="numero" class="form-label">Número</label>
            <input name="n_casa" type="text" class="form-control" id="numero" value="{{company().n_casa}}">
        </div>

        <div class="col-md-3 mb-3">
            <label for="bairro" class="form-label">Bairro</label>
            <input name="bairro" type="text" class="form-control" id="bairro" value="{{company().bairro}}">
        </div>
        <div class="col-md-2 mb-3">
            <label for="cidade" class="form-label">Cidade</label>
            <input name="cidade" type="text" class="form-control" id="cidade" value="{{company().cidade}}">
        </div>
        <div class="col-md-1 mb-3">
            <label for="estado" class="form-label">Estado</label>
            <select name="uf" class="form-select" id="estado">
                <option value="" selected disabled>UF</option>
                {% for estado in
                ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO']
                %}
                <option {% if estado==company().uf %}selected{% endif %} value="{{ estado }}">{{ estado }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <!-- Redes Sociais -->
    <h5 class="mt-4 mb-3">Redes Sociais</h5>
    <hr>
    <div class="row">
        <div class="col-md-4 mb-3">
            <div class="input-group">
                <span class="input-group-text">Facebook</span>
                <input name="facebook" type="text" class="form-control" id="facebook" placeholder="@suaempresa"
                    value="{{company().facebook}}">
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="input-group">
                <span class="input-group-text">Instagram</span>
                <input name="instagram" type="text" class="form-control" id="instagram" placeholder="@suaempresa"
                    value="{{company().instagram}}">
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="input-group">
                <span class="input-group-text">YouTube</span>
                <input name="youtube" type="text" class="form-control" id="youtube" placeholder="@suaempresa"
                    value="{{company().youtube}}">
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3">
            <div class="input-group">
                <span class="input-group-text">LinkedIn</span>
                <input name="linkedin" type="text" class="form-control" id="linkedin" placeholder="@suaempresa"
                    value="{{company().linkedin}}">
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="input-group">
                <span class="input-group-text">X (Twitter)</span>
                <input name="x" type="text" class="form-control" id="x" placeholder="@suaempresa" value="{{company().x}}">
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="input-group">
                <span class="input-group-text">TikTok</span>
                <input name="tiktok" type="text" class="form-control" id="tiktok" placeholder="@suaempresa"
                    value="{{company().tiktok}}">
            </div>
        </div>
    </div>

    <!-- Botões de Ação -->
    <div class="row my-4">
        <div class="text-center">
            <button type="submit" class="botao">Salvar Alterações</button>
        </div>
    </div>
</form>

<script>
    // Preview da logo
    document.getElementById('logo').addEventListener('change', function (e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function (event) {
                const preview = document.getElementById('logo-preview');
                preview.src = event.target.result;
                preview.classList.remove('d-none');
            }
            reader.readAsDataURL(file);
        }
    });
</script>

{% endblock %}
