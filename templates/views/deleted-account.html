<head>

<body class="bg-light">

    <div class="container d-flex align-items-center justify-content-center vh-100">

                <h3 class="text-danger fw-bold">Atenção</h3>

                <p class="mt-3 fs-5">
                    Sua conta está **marcada para exclusão** e será removida permanentemente em até  
                    <span class="fw-bold text-danger">60 dias</span>.
                </p>

                    o quanto antes.
                </p>
